name: Python Tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Python Setup
      uses: ./.github/actions/python-setup-action
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run pytest
      run: python -m pytest --junit-xml=${{ runner.temp }}/test-results.xml

    - name: Parse pytest results
      if: always()
      uses: pmeier/pytest-results-action@0841ca7226ab155943837380769373a5dd14d7ed # v0.8.0
      with:
        path: ${{ runner.temp }}/test-results.xml
        summary: true
        display-options: fEX
        fail-on-empty: true
        title: Pytest results
